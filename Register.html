<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club - Register</title></head>

<body>

    <h1>Coding Club</h1>

    <h2>Upcoming Events</h2>

    <table>
        <caption>Club Events</caption>

        <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>

        <tr>
            <td>HTML Worksheet</td>
            <td>12 Nov</td>
            <td>Lab 1</td>
        </tr>

        <tr>
            <td>Hackathon</td>
            <td>20 Nov</td>
            <td>Seminar Hall</td>
        </tr>

        <tr>
            <td colspan="3">Total Events: 2</td>
        </tr>
    </table>

    <form>
        <h2>Register</h2>

        <label for="name">Name:</label><br>
        <input type="text" id="name"
               placeholder="Enter your name">
        <br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password"
               placeholder="Enter your password">
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email"
               placeholder="Enter your email">
        <br><br>

        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone"
               placeholder="Enter your phone number">
        <br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="DOB">
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Interests:</label><br>
        <input type="checkbox" name="interest" value="Web"> Web
        <input type="checkbox" name="interest" value="DSA"> DSA
        <br><br>

        <label for="branch">Branch:</label><br>
        <select name="branch" id="branch">
            <option value="BCA">BCA</option>
            <option value="MBA">MBA</option>
            <option value="BTech">BTech</option>
        </select>
        <br><br>

        <label for="reason">Why do you want to join?</label><br>
        <textarea id="reason" name="reason"
                  rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Register">
    </form>

</body>
</html>
